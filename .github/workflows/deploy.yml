name: Deploy Church Scheduler V2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: church-scheduler-v2-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Syntax check
        run: npm run lint:syntax

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ secrets.AZURE_ACR_NAME }}"

      - name: Build and push image
        env:
          ACR: ${{ secrets.AZURE_ACR_NAME }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$ACR.azurecr.io/church-scheduler-v2:$SHA"
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy web app
        run: |
          az containerapp update \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --image "$IMAGE" \
            --output none

      - name: Deploy scheduler job image
        run: |
          az containerapp job update \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_CONTAINER_JOB_NAME }}" \
            --image "$IMAGE" \
            --cron-expression "*/5 * * * *" \
            --output none

      - name: Health check
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in {1..12}; do
            if curl --fail --silent --show-error "https://$FQDN/healthz"; then
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed" >&2
          exit 1
