<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb" id="theme-color">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Church App</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div class="header-brand">
        <img id="header-logo" class="header-logo" src="/assets/church-logo.png" alt="">
        <div><div class="eyebrow" id="church-name">Church</div><h1 id="page-title">Inicio</h1></div>
      </div>
      <div class="header-actions">
        <button class="mini-control" id="language-btn" aria-label="Language">ES</button>
        <button class="icon-btn compact" id="theme-btn" aria-label="Theme">◐</button>
        <button class="icon-btn compact hidden" id="logout-btn" aria-label="Sign out">↪</button>
      </div>
    </header>
    <main id="main" class="main"></main>
    <nav id="bottom-nav" class="bottom-nav hidden"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
